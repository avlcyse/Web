<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>portfolio.sh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #060907;
    --panel: #0b120d;
    --green: #4dffa0;
    --green-dim: #1f4d34;
    --green-muted: #6f9c82;
    --amber: #ffb454;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--void);
    color: var(--green);
    font-family: 'IBM Plex Mono', monospace;
    min-height: 100vh;
  }
  #matrix-bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0.16;
    z-index: 0;
  }
  .stage {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .boot {
    font-family: 'VT323', monospace;
    font-size: 22px;
    line-height: 1.6;
    margin-bottom: 4px;
  }
  .boot .line { opacity: 0; animation: reveal 0.2s forwards; }
  .boot .line:nth-child(1) { animation-delay: 0.1s; }
  .boot .line:nth-child(2) { animation-delay: 0.6s; }
  .boot .line:nth-child(3) { animation-delay: 1.1s; }
  @keyframes reveal { to { opacity: 1; } }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    border: 1px solid var(--green-dim);
    border-radius: 6px;
    opacity: 0;
    transform: translateY(8px);
    animation: cardIn 0.5s ease forwards;
    animation-delay: 1.5s;
  }
  @keyframes cardIn { to { opacity: 1; transform: translateY(0); } }

  .card-header {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--green-dim);
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .dot.r { background: #ff5f57; }
  .dot.y { background: #febc2e; }
  .dot.g { background: #28c840; }
  .card-title {
    font-family: 'VT323', monospace;
    font-size: 17px;
    color: var(--green-muted);
    margin-left: 6px;
  }

  .card-body { padding: 28px 24px; }

  .photo-frame {
    display: block;
    width: 96px;
    height: 96px;
    margin: 0 auto 26px;
    position: relative;
    cursor: pointer;
  }
  .photo-frame:focus-visible { outline: 2px solid var(--amber); outline-offset: 5px; }
  .photo-frame .corner {
    position: absolute;
    width: 16px;
    height: 16px;
    border-color: var(--green);
    border-style: solid;
    border-width: 0;
  }
  .photo-frame .c1 { top: -2px; left: -2px; border-top-width: 2px; border-left-width: 2px; }
  .photo-frame .c2 { top: -2px; right: -2px; border-top-width: 2px; border-right-width: 2px; }
  .photo-frame .c3 { bottom: -2px; left: -2px; border-bottom-width: 2px; border-left-width: 2px; }
  .photo-frame .c4 { bottom: -2px; right: -2px; border-bottom-width: 2px; border-right-width: 2px; }
  .photo-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }
  .photo-frame .placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--green-muted);
    font-size: 11px;
    text-align: center;
    line-height: 1.4;
    padding: 8px;
  }

  .field { margin-bottom: 20px; }
  .field label {
    display: block;
    font-size: 13px;
    color: var(--green-muted);
    margin-bottom: 6px;
  }
  .field .row { display: flex; align-items: center; }
  .field .prompt { color: var(--green-dim); margin-right: 6px; }
  .field input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--green-dim);
    color: var(--green);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    padding: 4px 2px;
    outline: none;
  }
  .field input::placeholder { color: var(--green-muted); opacity: 0.6; }
  .field input:focus { border-bottom-color: var(--green); box-shadow: 0 1px 0 0 var(--green); }

  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; min-height: 24px; }
  .tag {
    font-size: 12px;
    color: var(--green);
    border: 1px solid var(--green-dim);
    padding: 3px 8px;
    border-radius: 3px;
  }

  .cursor {
    display: inline-block;
    width: 8px;
    height: 15px;
    background: var(--amber);
    margin-left: 4px;
    animation: blink 1s step-start infinite;
    vertical-align: middle;
  }
  @keyframes blink { 50% { opacity: 0; } }

  @media (max-width: 380px) {
    .card-body { padding: 22px 16px; }
    .photo-frame { width: 84px; height: 84px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .boot .line { animation: none; opacity: 1; }
    .card { animation: none; opacity: 1; transform: none; }
    .cursor { animation: none; }
  }
</style>
</head>
<body>
<canvas id="matrix-bg" aria-hidden="true"></canvas>
<div class="stage">
  <div>
    <div class="boot" aria-hidden="true">
      <div class="line">$ init profile.sh</div>
      <div class="line">loading assets... ok</div>
      <div class="line">ready<span class="cursor"></span></div>
    </div>
    <div class="card">
      <div class="card-header">
        <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
        <span class="card-title">visitor@portfolio:~$</span>
      </div>
      <div class="card-body">
        <label class="photo-frame" for="avatarInput" id="photoFrame" tabindex="0" aria-label="Upload foto profil">
          <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
          <img id="avatarImg" alt="Foto profil">
          <span class="placeholder" id="avatarPlaceholder">upload<br>foto</span>
          <input type="file" id="avatarInput" accept="image/*" hidden>
        </label>
        <div class="field">
          <label for="nameInput">nama:</label>
          <div class="row"><span class="prompt">&gt;</span><input type="text" id="nameInput" placeholder="nama kamu"></div>
        </div>
        <div class="field">
          <label for="skillInput">keahlian:</label>
          <div class="row"><span class="prompt">&gt;</span><input type="text" id="skillInput" placeholder="html, css, javascript"></div>
          <div class="tags" id="tags"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  // latar belakang efek "matrix rain"
  var canvas = document.getElementById('matrix-bg');
  var ctx = canvas.getContext('2d');
  var fontSize = 16;
  var columns, drops;

  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    columns = Math.floor(canvas.width / fontSize);
    drops = new Array(columns).fill(1);
  }
  resize();
  window.addEventListener('resize', resize);

  var chars = 'アイウエオカキクケコサシスセソ0123456789';
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function draw(){
    ctx.fillStyle = 'rgba(6,9,7,0.08)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#4dffa0';
    ctx.font = fontSize + 'px monospace';
    for (var i = 0; i < drops.length; i++){
      var text = chars.charAt(Math.floor(Math.random() * chars.length));
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);
      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975){
        drops[i] = 0;
      }
      drops[i]++;
    }
  }

  if (!reduced) {
    setInterval(draw, 60);
  }

  // upload & preview foto profil
  var avatarInput = document.getElementById('avatarInput');
  var avatarImg = document.getElementById('avatarImg');
  var avatarPlaceholder = document.getElementById('avatarPlaceholder');
  var photoFrame = document.getElementById('photoFrame');

  avatarInput.addEventListener('change', function(e){
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      avatarImg.src = ev.target.result;
      avatarImg.style.display = 'block';
      avatarPlaceholder.style.display = 'none';
    };
    reader.readAsDataURL(file);
  });

  photoFrame.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      avatarInput.click();
    }
  });

  // ubah tulisan keahlian jadi tag terpisah
  var skillInput = document.getElementById('skillInput');
  var tagsEl = document.getElementById('tags');

  skillInput.addEventListener('input', function(){
    var parts = skillInput.value.split(',').map(function(s){ return s.trim(); }).filter(function(s){ return s.length > 0; });
    tagsEl.innerHTML = '';
    parts.forEach(function(p){
      var span = document.createElement('span');
      span.className = 'tag';
      span.textContent = p;
      tagsEl.appendChild(span);
    });
  });
})();
</script>
</body>
</html>
