<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>portfolio.sh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #060907;
    --panel: #0b120d;
    --green: #4dffa0;
    --green-dim: #1f4d34;
    --green-muted: #6f9c82;
    --amber: #ffb454;
    --red: #ff5f57;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--void);
    color: var(--green);
    font-family: 'IBM Plex Mono', monospace;
    min-height: 100vh;
  }
  button { background: transparent; border: none; cursor: pointer; padding: 0; color: inherit; font-family: inherit; }
  button:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
  #matrix-bg { position: fixed; inset: 0; width: 100%; height: 100%; opacity: 0.16; z-index: 0; }
  .stage { position: relative; z-index: 1; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .boot { font-family: 'VT323', monospace; font-size: 22px; line-height: 1.6; margin-bottom: 4px; }
  .boot .line { opacity: 0; animation: reveal 0.2s forwards; }
  .boot .line:nth-child(1) { animation-delay: 0.05s; }
  .boot .line:nth-child(2) { animation-delay: 0.3s; }
  .boot .line:nth-child(3) { animation-delay: 0.55s; }
  @keyframes reveal { to { opacity: 1; } }

  .reopen-hint { display: none; font-family: 'VT323', monospace; font-size: 18px; color: var(--green-muted); text-align: center; cursor: pointer; }
  .reopen-hint:hover { color: var(--green); }

  .card {
    width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--green-dim); border-radius: 6px;
    opacity: 0; transform: translateY(8px); animation: cardIn 0.35s ease forwards; animation-delay: 0.8s; overflow: hidden;
  }
  @keyframes cardIn { to { opacity: 1; transform: translateY(0); } }

  .card-header { display: flex; align-items: center; gap: 7px; padding: 10px 14px; border-bottom: 1px solid var(--green-dim); }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; display: block; }
  .dot.r { background: var(--red); }
  .dot.y { background: #febc2e; }
  .dot.g { background: #28c840; }
  .card-title { font-family: 'VT323', monospace; font-size: 17px; color: var(--green-muted); margin-left: 6px; }
  .header-spacer { flex: 1; }
  .icon-btn { color: var(--green-muted); display: flex; align-items: center; }
  .icon-btn:hover { color: var(--green); }

  .flip-inner { perspective: 900px; }
  .card-face { padding: 26px 24px; transition: transform 0.3s ease, opacity 0.3s ease; }

  .photo-frame { display: block; width: 104px; height: 140px; margin: 0 auto 20px; position: relative; }
  label.photo-frame { cursor: pointer; }
  .photo-frame:focus-visible { outline: 2px solid var(--amber); outline-offset: 5px; }
  .corner { position: absolute; width: 16px; height: 16px; border-color: var(--green); border-style: solid; border-width: 0; }
  .c1 { top: -2px; left: -2px; border-top-width: 2px; border-left-width: 2px; }
  .c2 { top: -2px; right: -2px; border-top-width: 2px; border-right-width: 2px; }
  .c3 { bottom: -2px; left: -2px; border-bottom-width: 2px; border-left-width: 2px; }
  .c4 { bottom: -2px; right: -2px; border-bottom-width: 2px; border-right-width: 2px; }
  .photo-frame img { width: 100%; height: 100%; object-fit: cover; display: none; }
  .photo-frame .placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--green-muted); font-size: 11px; text-align: center; line-height: 1.4; padding: 8px; }

  .field, .static-row { margin-bottom: 18px; }
  .field label, .static-label { display: block; font-size: 13px; color: var(--green-muted); margin-bottom: 6px; }
  .static-label { display: inline; margin-right: 6px; }
  .row { display: flex; align-items: center; }
  .prompt { color: var(--green-dim); margin-right: 6px; }
  input[type="text"], input[type="password"] {
    flex: 1; min-width: 0; background: transparent; border: none; border-bottom: 1px solid var(--green-dim);
    color: var(--green); font-family: 'IBM Plex Mono', monospace; font-size: 15px; padding: 4px 2px; outline: none;
  }
  input::placeholder { color: var(--green-muted); opacity: 0.6; }
  input:focus { border-bottom-color: var(--green); box-shadow: 0 1px 0 0 var(--green); }

  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; min-height: 24px; }
  .tag { font-size: 12px; color: var(--green); border: 1px solid var(--green-dim); padding: 3px 8px; border-radius: 3px; }

  .cursor { display: inline-block; width: 8px; height: 15px; background: var(--amber); margin-left: 4px; animation: blink 1s step-start infinite; vertical-align: middle; }
  @keyframes blink { 50% { opacity: 0; } }

  .btn { border: 1px solid var(--green-dim); color: var(--green); font-size: 13px; padding: 7px 16px; border-radius: 3px; }
  .btn:hover { border-color: var(--green); }
  .btn-text { color: var(--green-muted); font-size: 13px; text-decoration: underline; }
  .btn-text:hover { color: var(--green); }
  .btn-row { display: flex; align-items: center; gap: 14px; margin-top: 14px; }

  .password-panel { margin-bottom: 18px; }
  .password-error { font-size: 12px; color: var(--red); min-height: 16px; margin-top: 6px; }

  .qr-wrap { position: relative; width: 140px; height: 140px; margin: 0 auto 20px; }
  .qr-wrap img { width: 100%; height: 100%; display: block; }
  .qr-wrap.editable { cursor: pointer; }
  .qr-wrap.editable:hover .corner { border-color: var(--amber); }
  .audio-status { display: none; font-size: 11px; color: var(--amber); text-align: center; margin: -12px 0 16px; }
  .link { color: var(--green); text-decoration: underline; word-break: break-all; }
  .contact-row { display: flex; justify-content: center; align-items: baseline; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
  .fake-geo { margin-top: 30px; font-size: 12px; color: var(--green-muted); text-align: center; }

  .music-player {
    position: fixed; left: 16px; bottom: 16px; z-index: 2;
    width: 220px; background: var(--panel); border: 1px solid var(--green-dim); border-radius: 6px;
    padding: 10px 12px; font-size: 12px;
  }
  .music-viz { display: flex; align-items: flex-end; gap: 3px; height: 20px; margin-bottom: 8px; }
  .music-viz .bar { width: 3px; background: var(--green); height: 4px; border-radius: 1px; opacity: 0.4; transition: height 0.08s ease, opacity 0.3s; }
  .music-viz.is-playing .bar { opacity: 1; animation: eqBounce 0.9s ease-in-out infinite; }
  .music-viz.is-playing .bar:nth-child(1) { animation-delay: 0s; }
  .music-viz.is-playing .bar:nth-child(2) { animation-delay: 0.12s; }
  .music-viz.is-playing .bar:nth-child(3) { animation-delay: 0.24s; }
  .music-viz.is-playing .bar:nth-child(4) { animation-delay: 0.08s; }
  .music-viz.is-playing .bar:nth-child(5) { animation-delay: 0.2s; }
  .music-viz.is-playing .bar:nth-child(6) { animation-delay: 0.3s; }
  .music-viz.is-playing .bar:nth-child(7) { animation-delay: 0.16s; }
  @keyframes eqBounce { 0%, 100% { height: 4px; } 50% { height: 20px; } }
  .music-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
  .music-now { color: var(--green-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  #mTime { flex-shrink: 0; color: var(--green-muted); }
  .music-controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; margin-bottom: 4px; }
  .music-controls button, .music-controls span { color: var(--green); }
  .music-controls span { color: var(--green-muted); }
  .music-controls button:hover { color: var(--amber); }

  @media (max-width: 380px) {
    .card-face { padding: 22px 16px; }
    .photo-frame { width: 90px; height: 120px; }
    .music-player { width: 180px; left: 10px; bottom: 10px; font-size: 11px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .boot .line { animation: none; opacity: 1; }
    .card { animation: none; opacity: 1; transform: none; }
    .cursor { animation: none; }
    .card-face { transition: none; }
    .music-viz .bar { animation: none !important; }
  }
</style>
</head>
<body>
<canvas id="matrix-bg" aria-hidden="true"></canvas>
<div class="stage">
  <div style="width:100%; max-width:420px;">
    <div class="boot" aria-hidden="true">
      <div class="line">$ init profile.sh</div>
      <div class="line">loading assets... ok</div>
      <div class="line">ready<span class="cursor"></span></div>
    </div>

    <div class="reopen-hint" id="reopenHint" role="button" tabindex="0">[ window closed &mdash; click to reopen ]</div>

    <div class="card" id="cardWrapper">
      <div class="card-header">
        <button class="dot r" id="btnClose" aria-label="Close window" title="Close"></button>
        <button class="dot y" id="btnMinimize" aria-label="Minimize window" title="Minimize"></button>
        <button class="dot g" id="btnFlip" aria-label="Flip card" title="View contact"></button>
        <span class="card-title">visitor@portfolio:~$</span>
        <span class="header-spacer"></span>
        <button class="icon-btn" id="lockBtn" title="Edit mode (password required)" aria-label="Open edit mode">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="3" y="7" width="10" height="7" rx="1"></rect><path d="M5 7V5a3 3 0 0 1 6 0v2"></path></svg>
        </button>
      </div>

      <div class="flip-inner">
        <div class="card-face" id="cardFront">

          <div class="password-panel" id="passwordPanel" style="display:none;">
            <label for="passwordInput" style="display:block; font-size:13px; color:var(--green-muted); margin-bottom:6px;">password:</label>
            <div class="row"><span class="prompt">&gt;</span><input type="password" id="passwordInput" placeholder="••••••"></div>
            <div class="password-error" id="passwordError"></div>
            <div class="btn-row">
              <button class="btn" id="passwordSubmit">unlock</button>
              <button class="btn-text" id="passwordCancel">cancel</button>
            </div>
          </div>

          <div id="staticView">
            <div class="photo-frame" id="avatarStaticFrame">
              <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
              <img id="avatarStaticImg" alt="Profile photo" style="display:none;">
              <span class="placeholder">no<br>photo</span>
            </div>
            <div class="static-row"><span class="prompt">&gt;</span><span class="static-label">name:</span><span id="nameStatic">Your Name</span></div>
            <div class="static-row" style="margin-bottom:0;"><span class="prompt">&gt;</span><span class="static-label">skills:</span></div>
            <div class="tags" id="skillsStatic"></div>
          </div>

          <div id="editView" style="display:none;">
            <label class="photo-frame" for="avatarInput" id="photoFrame" tabindex="0" aria-label="Upload profile photo">
              <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
              <img id="avatarImg" alt="Profile photo">
              <span class="placeholder" id="avatarPlaceholder">upload<br>photo</span>
              <input type="file" id="avatarInput" accept="image/*" hidden>
            </label>
            <div class="field">
              <label for="nameInput">name:</label>
              <div class="row"><span class="prompt">&gt;</span><input type="text" id="nameInput" placeholder="your name"></div>
            </div>
            <div class="field" style="margin-bottom:6px;">
              <label for="skillInput">skills:</label>
              <div class="row"><span class="prompt">&gt;</span><input type="text" id="skillInput" placeholder="html, css, javascript"></div>
              <div class="tags" id="tags"></div>
            </div>
            <div class="btn-row">
              <button class="btn" id="saveBtn">save &amp; lock</button>
              <button class="btn-text" id="cancelEditBtn">cancel</button>
            </div>
          </div>

        </div>

        <div class="card-face" id="cardBack" style="display:none;">
          <div class="qr-wrap" id="qrWrap">
            <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
            <img id="qrImg" alt="Contact QR">
            <input type="file" id="audioInput" accept="audio/*" hidden>
          </div>
          <p class="audio-status" id="audioStatus"></p>
          <div class="contact-row"><span class="prompt">&gt;</span><span class="static-label">email:</span><a id="emailLink" class="link" href="#"></a></div>
          <div class="contact-row"><span class="prompt">&gt;</span><span class="static-label">github:</span><a id="githubLink" class="link" href="#" target="_blank" rel="noopener"></a></div>
          <div class="contact-row" style="margin-bottom:0;"><span class="prompt">&gt;</span><span class="static-label">website:</span><a id="websiteLink" class="link" href="#" target="_blank" rel="noopener"></a></div>
          <div class="fake-geo" id="fakeGeo"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="music-player">
  <div class="music-viz" id="musicViz" aria-hidden="true"><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span></div>
  <div class="music-top">
    <span class="music-now" id="musicNow">no music yet</span>
    <span id="mTime">00:00</span>
  </div>
  <div class="music-controls">
    <button id="mBack">[-10]</button>
    <button id="mPlay">[play]</button>
    <button id="mStop">[stop]</button>
    <button id="mFwd">[+10]</button>
  </div>
  <div class="music-controls">
    <button id="mVolDown">[v-]</button>
    <span id="mVol">70%</span>
    <button id="mVolUp">[v+]</button>
  </div>
  <audio id="audioPlayer"></audio>
</div>

<script>
(function(){

  // ====== CHANGE THIS SECTION BEFORE DEPLOYING ======
  var EDIT_PASSWORD = "ganti123";
  var CONTACT_EMAIL = "namakamu@gmail.com";
  var CONTACT_GITHUB = "github.com/namakamu";
  var CONTACT_WEBSITE = "namakamu.dev";
  // ====================================================

  // matrix rain background effect, with an occasional glitch burst
  var canvas = document.getElementById('matrix-bg');
  var ctx = canvas.getContext('2d');
  var fontSize = 16;
  var columns, drops;
  function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    columns = Math.floor(canvas.width / fontSize);
    drops = new Array(columns).fill(1);
  }
  resize();
  window.addEventListener('resize', resize);
  var chars = 'アイウエオカキクケコサシスセソ0123456789';
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var glitchUntil = 0;
  function drawMatrix(){
    ctx.fillStyle = 'rgba(6,9,7,0.08)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#4dffa0';
    ctx.font = fontSize + 'px monospace';
    for (var i = 0; i < drops.length; i++){
      var text = chars.charAt(Math.floor(Math.random() * chars.length));
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);
      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975){ drops[i] = 0; }
      drops[i]++;
    }
    if (Date.now() >= glitchUntil && Math.random() < 0.004) {
      glitchUntil = Date.now() + 120 + Math.random() * 180;
    }
    if (Date.now() < glitchUntil) {
      for (var g = 0; g < 4; g++) {
        var gy = Math.random() * canvas.height;
        var gh = 3 + Math.random() * 8;
        var gx = (Math.random() - 0.5) * 50;
        ctx.drawImage(canvas, 0, gy, canvas.width, gh, gx, gy, canvas.width, gh);
      }
      if (Math.random() < 0.4) {
        ctx.fillStyle = 'rgba(255,180,84,0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
    }
  }
  if (!reduced) { setInterval(drawMatrix, 60); }

  // fill in QR, email, github, website, fake geo on the back of the card
  document.getElementById('qrImg').src = 'https://api.qrserver.com/v1/create-qr-code/?size=140x140&bgcolor=0b120d&color=4dffa0&data=' + encodeURIComponent('https://' + CONTACT_GITHUB);
  var emailLink = document.getElementById('emailLink');
  emailLink.href = 'mailto:' + CONTACT_EMAIL;
  emailLink.textContent = CONTACT_EMAIL;
  var githubLink = document.getElementById('githubLink');
  githubLink.href = 'https://' + CONTACT_GITHUB;
  githubLink.textContent = CONTACT_GITHUB;
  var websiteLink = document.getElementById('websiteLink');
  websiteLink.href = 'https://' + CONTACT_WEBSITE;
  websiteLink.textContent = CONTACT_WEBSITE;
  document.getElementById('fakeGeo').textContent = '36.85.214.7 · Bandung, Indonesia';

  // red = close, yellow = minimize, green = flip card
  var cardWrapper = document.getElementById('cardWrapper');
  var reopenHint = document.getElementById('reopenHint');
  document.getElementById('btnClose').addEventListener('click', function(){
    cardWrapper.style.display = 'none';
    reopenHint.style.display = 'block';
  });
  function reopen(){ cardWrapper.style.display = 'block'; reopenHint.style.display = 'none'; }
  reopenHint.addEventListener('click', reopen);
  reopenHint.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); reopen(); } });

  var flipInner = document.querySelector('.flip-inner');
  var isMinimized = false;
  document.getElementById('btnMinimize').addEventListener('click', function(){
    isMinimized = !isMinimized;
    flipInner.style.display = isMinimized ? 'none' : 'block';
  });

  var cardFront = document.getElementById('cardFront');
  var cardBack = document.getElementById('cardBack');
  var showingBack = false;
  function flipCard(){
    var outgoing = showingBack ? cardBack : cardFront;
    var incoming = showingBack ? cardFront : cardBack;
    outgoing.style.transform = 'rotateY(90deg)';
    outgoing.style.opacity = '0';
    setTimeout(function(){
      outgoing.style.display = 'none';
      outgoing.style.transform = '';
      outgoing.style.opacity = '';
      incoming.style.display = 'block';
      incoming.style.transform = 'rotateY(-90deg)';
      incoming.style.opacity = '0';
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          incoming.style.transform = 'rotateY(0deg)';
          incoming.style.opacity = '1';
        });
      });
      showingBack = !showingBack;
    }, 300);
  }
  document.getElementById('btnFlip').addEventListener('click', flipCard);
  function ensureFrontShowing(){
    if (showingBack) {
      cardBack.style.display = 'none';
      cardFront.style.display = 'block';
      cardFront.style.transform = ''; cardFront.style.opacity = '';
      showingBack = false;
    }
  }

  // upload & preview profile photo (edit mode)
  var avatarInput = document.getElementById('avatarInput');
  var avatarImg = document.getElementById('avatarImg');
  var avatarPlaceholder = document.getElementById('avatarPlaceholder');
  var photoFrame = document.getElementById('photoFrame');
  avatarInput.addEventListener('change', function(e){
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      avatarImg.src = ev.target.result;
      avatarImg.style.display = 'block';
      avatarPlaceholder.style.display = 'none';
    };
    reader.readAsDataURL(file);
  });
  photoFrame.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); avatarInput.click(); }
  });

  // turn skills text into separate tags (edit mode)
  var skillInput = document.getElementById('skillInput');
  var tagsEl = document.getElementById('tags');
  function renderTags(){
    var parts = skillInput.value.split(',').map(function(s){ return s.trim(); }).filter(function(s){ return s.length > 0; });
    tagsEl.innerHTML = '';
    parts.forEach(function(p){
      var span = document.createElement('span');
      span.className = 'tag';
      span.textContent = p;
      tagsEl.appendChild(span);
    });
  }
  skillInput.addEventListener('input', renderTags);

  // audio upload: click the QR in edit mode to choose a file
  var qrWrap = document.getElementById('qrWrap');
  var audioInput = document.getElementById('audioInput');
  var audioStatus = document.getElementById('audioStatus');
  var pendingAudioSrc = null, pendingAudioName = null;
  qrWrap.addEventListener('click', function(){
    if (isEditing) audioInput.click();
  });
  audioInput.addEventListener('change', function(e){
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      pendingAudioSrc = ev.target.result;
      pendingAudioName = file.name;
      audioStatus.textContent = 'audio selected: ' + file.name + ' (click save to apply)';
      audioStatus.style.display = 'block';
    };
    reader.readAsDataURL(file);
  });

  // password lock to enter edit mode
  var isEditing = false;
  var staticView = document.getElementById('staticView');
  var editView = document.getElementById('editView');
  var passwordPanel = document.getElementById('passwordPanel');
  var passwordInput = document.getElementById('passwordInput');
  var passwordError = document.getElementById('passwordError');
  var nameStatic = document.getElementById('nameStatic');
  var skillsStatic = document.getElementById('skillsStatic');
  var avatarStaticImg = document.getElementById('avatarStaticImg');
  var avatarStaticPlaceholder = document.querySelector('#avatarStaticFrame .placeholder');
  var musicNow = document.getElementById('musicNow');
  var audioPlayer = document.getElementById('audioPlayer');

  document.getElementById('lockBtn').addEventListener('click', function(){
    if (!isEditing) { ensureFrontShowing(); }
    passwordPanel.style.display = passwordPanel.style.display === 'none' ? 'block' : 'none';
    passwordInput.value = '';
    passwordError.textContent = '';
    passwordInput.focus();
  });
  document.getElementById('passwordCancel').addEventListener('click', function(){
    passwordPanel.style.display = 'none';
  });
  function tryUnlock(){
    if (passwordInput.value === EDIT_PASSWORD) {
      passwordPanel.style.display = 'none';
      enterEditMode();
    } else {
      passwordError.textContent = 'wrong password';
    }
  }
  document.getElementById('passwordSubmit').addEventListener('click', tryUnlock);
  passwordInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); tryUnlock(); } });

  function enterEditMode(){
    isEditing = true;
    staticView.style.display = 'none';
    editView.style.display = 'block';
    qrWrap.classList.add('editable');
    qrWrap.title = 'Click to upload audio';
    document.getElementById('nameInput').value = nameStatic.textContent === 'Your Name' ? '' : nameStatic.textContent;
    var currentSkills = Array.prototype.map.call(skillsStatic.querySelectorAll('.tag'), function(t){ return t.textContent; });
    skillInput.value = currentSkills.join(', ');
    renderTags();
    if (avatarStaticImg.style.display === 'block' && avatarStaticImg.src) {
      avatarImg.src = avatarStaticImg.src;
      avatarImg.style.display = 'block';
      avatarPlaceholder.style.display = 'none';
    }
  }
  function exitEditMode(){
    isEditing = false;
    editView.style.display = 'none';
    staticView.style.display = 'block';
    qrWrap.classList.remove('editable');
    qrWrap.removeAttribute('title');
    audioStatus.style.display = 'none';
    pendingAudioSrc = null;
    pendingAudioName = null;
  }
  document.getElementById('cancelEditBtn').addEventListener('click', exitEditMode);

  document.getElementById('saveBtn').addEventListener('click', function(){
    var name = document.getElementById('nameInput').value.trim();
    nameStatic.textContent = name || 'Your Name';
    skillsStatic.innerHTML = tagsEl.innerHTML;
    if (avatarImg.style.display === 'block' && avatarImg.src) {
      avatarStaticImg.src = avatarImg.src;
      avatarStaticImg.style.display = 'block';
      avatarStaticPlaceholder.style.display = 'none';
    }
    if (pendingAudioSrc) {
      audioPlayer.setAttribute('src', pendingAudioSrc);
      musicNow.textContent = pendingAudioName;
    }
    exitEditMode();
    downloadUpdatedFile();
  });

  function downloadUpdatedFile(){
    try {
      var html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      var blob = new Blob([html], { type: 'text/html' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'portfolio.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch (err) {
      console.error('failed to download file', err);
    }
  }

  // music player
  audioPlayer.volume = 0.7;
  function updateVolDisplay(){ document.getElementById('mVol').textContent = Math.round(audioPlayer.volume * 100) + '%'; }
  function formatMMSS(sec){
    if (!isFinite(sec) || sec < 0) sec = 0;
    var m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  }
  var audioCtx = null, analyser = null, freqData = null, useRealViz = false;
  function setupVisualizer(){
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 32;
      var srcNode = audioCtx.createMediaElementSource(audioPlayer);
      srcNode.connect(analyser);
      analyser.connect(audioCtx.destination);
      freqData = new Uint8Array(analyser.frequencyBinCount);
      useRealViz = true;
    } catch (err) { useRealViz = false; }
  }
  setupVisualizer();

  var vizBars = document.querySelectorAll('#musicViz .bar');
  var vizBins = [1,2,3,4,5,7,9];
  function renderViz(){
    requestAnimationFrame(renderViz);
    if (useRealViz && !audioPlayer.paused) {
      analyser.getByteFrequencyData(freqData);
      for (var i = 0; i < vizBars.length; i++){
        var v = freqData[vizBins[i]] || 0;
        vizBars[i].style.height = (4 + (v / 255) * 20) + 'px';
      }
    } else if (audioPlayer.paused) {
      for (var j = 0; j < vizBars.length; j++){ vizBars[j].style.height = '4px'; }
    }
  }
  renderViz();

  document.getElementById('mPlay').addEventListener('click', function(){
    if (audioCtx && audioCtx.state === 'suspended') { audioCtx.resume(); }
    audioPlayer.play().catch(function(){});
  });
  document.getElementById('mStop').addEventListener('click', function(){
    audioPlayer.pause();
    audioPlayer.currentTime = 0;
  });
  document.getElementById('mBack').addEventListener('click', function(){ audioPlayer.currentTime = Math.max(0, (audioPlayer.currentTime||0) - 10); });
  document.getElementById('mFwd').addEventListener('click', function(){ audioPlayer.currentTime = (audioPlayer.currentTime||0) + 10; });
  document.getElementById('mVolDown').addEventListener('click', function(){ audioPlayer.volume = Math.max(0, audioPlayer.volume - 0.1); updateVolDisplay(); });
  document.getElementById('mVolUp').addEventListener('click', function(){ audioPlayer.volume = Math.min(1, audioPlayer.volume + 0.1); updateVolDisplay(); });
  audioPlayer.addEventListener('timeupdate', function(){ document.getElementById('mTime').textContent = formatMMSS(audioPlayer.currentTime); });
  var musicViz = document.getElementById('musicViz');
  audioPlayer.addEventListener('play', function(){ if (!useRealViz) musicViz.classList.add('is-playing'); });
  audioPlayer.addEventListener('pause', function(){ musicViz.classList.remove('is-playing'); });
  audioPlayer.addEventListener('ended', function(){ musicViz.classList.remove('is-playing'); });
  updateVolDisplay();

})();
</script>
</body>
</html>
